[package]
name = "windbag"
version = "0.2.0"
description = "Windbag - compose, schedule and publish to Bluesky, Mastodon, Reddit, X, LinkedIn, Threads, Instagram and Facebook Pages"
authors = ["entro314-labs"]
license = "MIT"
edition = "2024"
rust-version = "1.98.1"
default-run = "windbag"


[lib]
name = "windbag_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The agent door: an MCP stdio server over the same store, spawnable by any
# agent host (`claude mcp add windbag -- .../windbag-mcp`). A separate binary so it
# runs whether or not the app is open.
[[bin]]
name = "windbag-mcp"
path = "src/bin/mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs reads `cargo metadata` to locate the Apple Intelligence prebuilt
# dylib (macOS only) — cargo is the only thing that knows where a vendored or
# path-overridden dependency actually lives.
serde_json = "1"

[dependencies]
# `tray-icon` for the Show/Quit tray on Windows and Linux (lib.rs), which have
# no app menu to quit from.
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Second launch focuses the running window instead of starting a rival scheduler.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# Launch at login, started hidden: a scheduler that only runs while you happen to
# have the app open is not a scheduler.
tauri-plugin-autostart = "2"
tauri-plugin-window-state = "2"
# AT Protocol OAuth hands the authorization code back on a custom URI scheme —
# a loopback redirect is invalid for a production native client there — so the
# OS has to route `io.github.…:/callback` into the running app.
tauri-plugin-deep-link = "2"
# Signed, deferred auto-updates against the public windbag-releases mirror
# (src/update.rs). Default features on purpose: they carry `rustls-tls`, which is
# the same TLS choice this crate makes below, so no OpenSSL enters the graph. It
# does link its own reqwest 0.13 beside ours — the two majors cannot unify, and
# the alternative is pinning the whole app to the plugin's reqwest.
tauri-plugin-updater = "2"
# Apple's on-device Foundation model: the free, offline, keyless assistant tier.
# Deliberately NOT platform-gated — the plugin carries its own non-Apple-silicon
# stub whose every command rejects with `UnsupportedPlatform`, so registering it
# unconditionally keeps ONE builder and one capability file across platforms.
tauri-plugin-apple-intelligence = "0.12.0"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# The whole store: accounts, posts, targets, media, attempt log.
rusqlite = { version = "0.40", features = ["bundled"] }
# OS credential store for tokens and the user's own platform app credentials.
keyring = "4"

# All platform HTTP happens in Rust: no CORS, and the webview CSP stays tight.
# `blocking` because the scheduler is a plain worker thread and every adapter
# call is a short request/response - an async runtime would buy nothing here.
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "blocking",
  "json",
  "gzip",
  "multipart",
] }

# Scheduling is civil-time arithmetic: a post set for 09:00 local must fire at
# 09:00 local across a DST boundary, which needs real date maths.
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
sha2 = "0.11"
# ES256 for DPoP (AT Protocol OAuth). `default-features = false` drops the
# precomputed base-point tables and the parts of the curve this never touches;
# `ecdsa` brings the signer and, with it, the arithmetic `VerifyingKey` needs to
# emit the public point that goes into every proof's JWK header.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
rand = "0.10"
url = "2"
# Bluesky counts its 300-character limit in grapheme clusters, not scalars: a
# family emoji is one character there and seven to `chars().count()`. The
# counter in the composer has to agree with the server or the app lies.
unicode-segmentation = "1"
# Opens the system browser for the OAuth handoff. Rust-side, so it works from
# the scheduler thread as well as from a command.
opener = "0.8"
dirs = "7"
log = "0.4"
# The `log` backend: a bundled GUI app has no terminal, so stderr is thrown
# away. This writes to the OS log directory as well, which is the only place a
# scheduler failure at 03:00 can be read afterwards.
tauri-plugin-log = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Vibrancy behind the transparent window. Taken direct rather than through
# tauri's `set_effects`, which discards the result: the renderer has to know
# what was ACTUALLY applied (Mica refuses on Windows 10). The same 0.8 line
# tauri links, so it adds no second copy to the graph.
window-vibrancy = "0.8"
# The title-bar surgery the traffic lights need (windowing.rs): a transparent
# titlebar over a full-size content view, plus the empty unified toolbar that
# makes AppKit place the lights itself. Same versions tauri/tao already link, so
# this adds no second copy to the graph. Apple-only at the CRATE level — objc2
# emits a hard `compile_error!` elsewhere — hence the target section.
objc2 = "0.6"
# `NSWindow` carries every enum used here (style mask, title visibility, toolbar
# style, titlebar separator); the rest of AppKit's bindings would be dead weight.
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.release.build-override]
opt-level = 0
codegen-units = 256
strip = false

[lints.rust]
unsafe_code = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

# Tauri command/macro noise:
needless_pass_by_value = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
